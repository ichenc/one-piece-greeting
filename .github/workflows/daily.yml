name: 🏴‍☠️ Daily Wanted Poster

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）生成新通缉令
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - generate.py
      - characters.json
      - README_template.md
      - .github/workflows/daily.yml

permissions:
  contents: write

concurrency:
  group: daily-wanted-poster
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate today's poster and README
        run: python generate.py --skip-preview

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/ history.json
          if git diff --staged --quiet; then
            echo "今日内容无变化，跳过提交"
            exit 0
          fi
          NAME=$(python -c "import json;print(json.load(open('history.json',encoding='utf-8'))[-1]['zh'])")
          git commit -m "🏴‍☠️ 今日通缉令：$NAME"
          git push
